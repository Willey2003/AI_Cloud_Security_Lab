# Sentinel//Lab CI — pipeline step 8: secret scanning · Trivy · Checkov · tests
# Gates fail by design on HIGH/CRITICAL findings or committed secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret-scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog full-history scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  build:
    name: build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  image:
    name: trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: sentinel-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sentinel-lab:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  iac:
    name: checkov + trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC scan (deploy/)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: deploy
          quiet: true
      - name: Trivy config scan (deploy/)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: deploy
          severity: HIGH,CRITICAL
          exit-code: "1"
