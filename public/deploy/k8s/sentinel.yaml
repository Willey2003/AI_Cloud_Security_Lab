# Sentinel//Lab — local cluster manifests (kind / minikube / k3d)
#   kubectl apply -f deploy/k8s/sentinel.yaml
#   kubectl -n sentinel-lab port-forward svc/sentinel-console 8443:80
apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-lab
  labels:
    app.kubernetes.io/name: sentinel-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-console
  namespace: sentinel-lab
  labels:
    app: sentinel-console
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-console
  template:
    metadata:
      labels:
        app: sentinel-console
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: sentinel-lab:0.1.0
          imagePullPolicy: IfNotPresent # use with: kind load docker-image / minikube image load
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-console
  namespace: sentinel-lab
spec:
  selector:
    app: sentinel-console
  ports:
    - port: 80
      targetPort: 8080
